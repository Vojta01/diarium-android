name: Android atomic date-move client tests

on:
  push:
    branches:
      - ci/android-atomic-date-move-20261110-df2378d

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests (no APK or release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out CI-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Confirm private build inputs are absent
        run: |
          test ! -e app/google-services.json
          test ! -e keystore.properties
          test ! -e local.properties

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'cz.digitalnivedomi.diarium.core.data.EntriesRepositoryDateMoveTest'

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-atomic-date-move-tests
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
