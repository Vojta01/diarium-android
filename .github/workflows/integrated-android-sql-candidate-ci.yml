name: Integrated Android + SQL candidate tests

on:
  push:
    branches:
      - ci/integrated-android-sql-candidate-20261111

permissions:
  contents: read

jobs:
  postgres-16:
    if: github.ref == 'refs/heads/ci/integrated-android-sql-candidate-20261111'
    name: PostgreSQL 16 migration, rollback, grants, and races
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: diarium_test_cas_move_candidate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diarium_test_cas_move_candidate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LOCAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/diarium_test_cas_move_candidate
      NON_TEST_GUARD_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out this exact candidate SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checked-out SHA
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          printf 'Testing candidate SHA %s\n' "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client
      - name: Confirm isolated PostgreSQL service is version 16
        run: |
          server_version_num="$(python3 database/tests/guard_local_test_database.py --exec -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num')"
          python3 -c 'import sys; value = int(sys.argv[1]); assert 160000 <= value < 170000, f"Expected PostgreSQL 16, got {value}"' "$server_version_num"
      - name: Run integrated SQL migration, rollback, compatibility, grants, and race tests
        run: bash database/tests/run_candidate_postgres_tests.sh

  android-tests:
    if: github.ref == 'refs/heads/ci/integrated-android-sql-candidate-20261111'
    name: Full Android and buildSrc unit tests (no APK/release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this exact candidate SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checked-out SHA
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          printf 'Testing candidate SHA %s\n' "$GITHUB_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Confirm private build inputs are absent
        run: |
          test ! -e app/google-services.json
          test ! -e keystore.properties
          test ! -e local.properties
      - name: Run complete Android app unit-test suite
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Run buildSrc tests
        if: always()
        run: ./gradlew -p buildSrc --no-daemon --max-workers=2 test
      - name: Upload synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-android-sql-candidate-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/**
            buildSrc/build/test-results/test/TEST-*.xml
            buildSrc/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
