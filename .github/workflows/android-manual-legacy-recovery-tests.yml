name: Android manual legacy recovery tests

on:
  push:
    branches:
      - ci/android-manual-legacy-recovery-20261110-a91c4d

permissions:
  contents: read

jobs:
  android-tests:
    name: Synthetic Android unit tests (no APK or release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Confirm private build inputs are absent
        run: |
          test ! -e app/google-services.json
          test ! -e keystore.properties
          test ! -e local.properties

      - name: Run complete app unit-test suite
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run buildSrc tests
        if: always()
        run: ./gradlew -p buildSrc --no-daemon --max-workers=2 test

      - name: Upload synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-manual-legacy-recovery-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/**
            buildSrc/build/test-results/test/TEST-*.xml
            buildSrc/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
