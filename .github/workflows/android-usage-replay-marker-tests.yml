name: Android usage replay marker tests

on:
  push:
    branches:
      - ci/fix-usage-replay-marker-20261111

permissions:
  contents: read

jobs:
  android-tests:
    name: Synthetic usage-sync replay tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Confirm private build inputs are absent
        run: |
          test ! -e app/google-services.json
          test ! -e keystore.properties
          test ! -e local.properties

      - name: Run focused usage-sync unit tests
        run: >-
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
          --tests 'cz.digitalnivedomi.diarium.core.data.UsageSyncConditionalWriteTest'
          --tests 'cz.digitalnivedomi.diarium.sync.UsageSyncWorkerIsolationTest'

      - name: Upload synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-usage-replay-marker-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
