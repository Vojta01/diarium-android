name: Android beta CI

on:
  push:
    branches:
      - ci/android-beta7-legacy-adoption
      - ci/android-beta8-conflict-resolution
      - ci/android-beta9-usage-conflicts

permissions:
  contents: read

jobs:
  android-unit-tests:
    if: startsWith(github.ref, 'refs/heads/ci/android-beta')
    name: Android unit tests (no APK or release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Confirm private build inputs are absent
        run: |
          test ! -e app/google-services.json
          test ! -e keystore.properties
          test ! -e local.properties

      - name: Run complete app unit-test suite
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run buildSrc tests
        if: always()
        run: ./gradlew -p buildSrc --no-daemon --max-workers=2 test

      - name: Upload synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-beta7-legacy-adoption-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/**
            buildSrc/build/test-results/test/TEST-*.xml
            buildSrc/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
