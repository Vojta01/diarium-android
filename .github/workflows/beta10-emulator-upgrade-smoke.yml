name: Beta10 signed APK upgrade smoke

on:
  workflow_dispatch:
  push:
    branches:
      - test/beta10-upgrade-smoke-20261116
    paths:
      - .github/workflows/beta10-emulator-upgrade-smoke.yml
      - .github/scripts/beta10-upgrade-smoke.sh
      - test-apk/diarium-beta10.apk

permissions:
  contents: read

jobs:
  beta9-to-beta10:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify candidate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo '8ae394c44460b38a7b60dad066d6ea9637b350c1662002077a8cd4e964ed018e  test-apk/diarium-beta10.apk' | sha256sum --check
      - name: Prepare Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and verify beta9 then in-place upgrade to beta10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: bash .github/scripts/beta10-upgrade-smoke.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta10-upgrade-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
