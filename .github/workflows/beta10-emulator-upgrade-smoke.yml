name: Beta10 signed APK upgrade smoke

on:
  workflow_dispatch:
  push:
    branches:
      - test/beta10-upgrade-smoke-20261116
    paths:
      - .github/workflows/beta10-emulator-upgrade-smoke.yml
      - test-apk/diarium-beta10.apk

permissions:
  contents: read

jobs:
  beta9-to-beta10:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify candidate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo '8ae394c44460b38a7b60dad066d6ea9637b350c1662002077a8cd4e964ed018e  test-apk/diarium-beta10.apk' | sha256sum --check
      - name: Prepare Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and verify beta9 then in-place upgrade to beta10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            mkdir -p artifacts
            BETA9="$RUNNER_TEMP/diarium-beta9.apk"
            curl --fail --location --silent --show-error \
              https://github.com/Vojta01/diarium-android/releases/download/v2.0.0-beta9/diarium-2.0.0-beta9.apk \
              --output "$BETA9"
            echo '63eab38f2ab426b9b9ba3cb514f8ba6c21c5c1ff04411aabcd9339b66f5a992c  '"$BETA9" | sha256sum --check
            BETA10="$GITHUB_WORKSPACE/test-apk/diarium-beta10.apk"
            SDK_APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
            "$SDK_APKSIGNER" verify --print-certs "$BETA9" | tee artifacts/beta9-certificate.txt
            "$SDK_APKSIGNER" verify --print-certs "$BETA10" | tee artifacts/beta10-certificate.txt
            CERT='0804b65bbcfc97271a7951b4e7a922381ce4d01bf2312298257bfacd5a5afae6'
            grep -F "Signer #1 certificate SHA-256 digest: $CERT" artifacts/beta9-certificate.txt
            grep -F "Signer #1 certificate SHA-256 digest: $CERT" artifacts/beta10-certificate.txt
            aapt dump badging "$BETA9" | grep -F "package: name='cz.digitalnivedomi.diarium' versionCode='2000109' versionName='2.0.0-beta9'" | tee artifacts/beta9-badging.txt
            aapt dump badging "$BETA10" | grep -F "package: name='cz.digitalnivedomi.diarium' versionCode='2000110' versionName='2.0.0-beta10'" | tee artifacts/beta10-badging.txt
            adb wait-for-device
            adb install "$BETA9"
            adb shell monkey -p cz.digitalnivedomi.diarium 1
            sleep 8
            adb logcat -d -t 5000 > artifacts/beta9-logcat.txt
            if grep -E 'FATAL EXCEPTION|Fatal signal|am_crash' artifacts/beta9-logcat.txt; then
              echo 'beta9 launch produced a fatal crash' >&2
              exit 1
            fi
            MARKER='diarium-agent-beta10-upgrade-smoke-marker-v1'
            if adb shell run-as cz.digitalnivedomi.diarium sh -c 'mkdir -p files && printf "%s" "$1" > files/agent-upgrade-smoke-marker.txt' sh "$MARKER" 2>/dev/null; then
              echo 'MARKER_SEEDED=true' | tee artifacts/marker-status.txt
            else
              echo 'MARKER_SEEDED=false; release APK does not permit run-as, so no private app data was accessed' | tee artifacts/marker-status.txt
            fi
            adb install -r "$BETA10"
            adb shell dumpsys package cz.digitalnivedomi.diarium > artifacts/package-after-upgrade.txt
            grep -E 'versionCode=2000110|minSdk=26|targetSdk=34' artifacts/package-after-upgrade.txt
            adb shell monkey -p cz.digitalnivedomi.diarium 1
            sleep 10
            adb logcat -d -t 8000 > artifacts/beta10-logcat.txt
            if grep -E 'FATAL EXCEPTION|Fatal signal|am_crash' artifacts/beta10-logcat.txt; then
              echo 'beta10 launch produced a fatal crash' >&2
              exit 1
            fi
            if grep -q '^MARKER_SEEDED=true' artifacts/marker-status.txt; then
              adb shell run-as cz.digitalnivedomi.diarium cat files/agent-upgrade-smoke-marker.txt > artifacts/marker-after-upgrade.txt
              test "$(cat artifacts/marker-after-upgrade.txt)" = "$MARKER"
            fi
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta10-upgrade-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
