name: beta11 isolated tests

on:
  push:
    branches:
      - ci/beta11-exact-source-tests

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact beta11 source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Run buildSrc tests
        run: ./gradlew -p buildSrc test --no-daemon
      - name: Upload unit-test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta11-unit-test-xml
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            buildSrc/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
