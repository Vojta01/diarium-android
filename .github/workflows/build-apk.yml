name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # google-services.json is NOT in the repo (never commit client keys).
      # Inject it from the GOOGLE_SERVICES_JSON repo secret (base64) when present.
      - name: Restore google-services.json from secret
        shell: bash
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set — FCM build requires it"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d ' \n' | base64 -d > app/google-services.json
          python3 -c "import json;json.load(open('app/google-services.json'))" \
            || { echo "::error::Decoded google-services.json is not valid JSON"; exit 1; }
          echo "google-services.json restored ($(wc -c < app/google-services.json) bytes)"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          echo "APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1) ($(wc -c < app/build/outputs/apk/debug/app-debug.apk) bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diarium-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diarium-android-apk
          path: apk

      - name: Rename APK for release
        run: mv apk/app-debug.apk apk/diarium-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/diarium-v1.0.0.apk
          generate_release_notes: true