name: Android recovered-draft rebase tests

on:
  push:
    branches:
      - ci/android-recovery-rebase-20261111
  workflow_dispatch:
    inputs:
      recovery_tests_only:
        description: Run only the synthetic recovered-draft UI suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  database-contract-tests:
    if: github.ref == 'refs/heads/ci/android-recovery-rebase-20261111'
    name: Database contract tests (static)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Android move capability contract
        run: python3 -m unittest discover -s database/tests -p 'test_android_move_capability_contract.py' -v

  android-unit-tests:
    if: github.ref == 'refs/heads/ci/android-recovery-rebase-20261111'
    name: Full Android unit tests (no APK or release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Confirm private build inputs are absent
        run: |
          test ! -e app/google-services.json
          test ! -e keystore.properties
          test ! -e local.properties

      - name: Run targeted recovered-draft UI tests
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_tests_only
        run: >-
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
          --tests cz.digitalnivedomi.diarium.ui.CheckInRecoveredDraftRebaseTest

      - name: Run complete app unit-test suite
        if: github.event_name != 'workflow_dispatch' || !inputs.recovery_tests_only
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run buildSrc tests
        if: always()
        run: ./gradlew -p buildSrc --no-daemon --max-workers=2 test

      - name: Upload synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recovered-draft-rebase-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/**
            buildSrc/build/test-results/test/TEST-*.xml
            buildSrc/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
