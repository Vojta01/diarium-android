android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# This VPS has 3.8 GB RAM. A 2 GB heap *plus* a second (Kotlin daemon) JVM
# exhausts swap and the build grinds for tens of minutes before finishing.
# Compiling in-process keeps it to one capped JVM: full assembleDebug +
# testDebugUnitTest then takes ~2m40s here. CI runners have plenty of headroom.
kotlin.compiler.execution.strategy=in-process